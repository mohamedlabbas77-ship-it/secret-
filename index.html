<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOULEFED & MEDOUD | Notre Espace Privé ✨</title>
  <style>
    :root {
      --bg-color: #0d0714;
      --card-bg: rgba(23, 14, 38, 0.7);
      --primary-color: #ff2e93;
      --accent-color: #00f2fe;
      --text-color: #f1f5f9;
      --border-color: rgba(255, 46, 147, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 46, 147, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 40%);
    }

    /* Login Screen */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(13, 7, 20, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 46, 147, 0.2);
    }

    .login-box h2 {
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .login-box p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    input[type="password"], input[type="text"], textarea, input[type="date"], input[type="file"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    input[type="file"] {
      cursor: pointer;
    }

    input:focus, textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 12px rgba(255, 46, 147, 0.3);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, var(--primary-color), #ff65a3);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 46, 147, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 46, 147, 0.7);
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    header {
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(13, 7, 20, 0.8);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      text-shadow: 0 0 10px rgba(255, 46, 147, 0.5);
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 20px 8% 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      color: #aaa;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary-color);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 46, 147, 0.5);
    }

    main {
      flex: 1;
      padding: 20px 8%;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .tab-content.active {
      display: block;
    }

    .add-form {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 30px;
    }

    .add-form h3 {
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .card-date {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.95rem;
      color: #ddd;
      line-height: 1.5;
    }

    .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 71, 87, 0.2);
      border: none;
      color: #ff4757;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
    }

    .checklist-item.done {
      opacity: 0.6;
      text-decoration: line-through;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>SOULEFED & MEDOUD ✨</h2>
      <p>Entrez le mot de passe pour accéder à votre espace privé</p>
      <div class="input-group">
        <input type="password" id="pass-input" placeholder="Mot de passe...">
      </div>
      <button class="btn" onclick="checkPassword()">Connexion 🔓</button>
      <div id="error-msg" class="error-msg">Mot de passe incorrect!</div>
    </div>
  </div>

  <header>
    <div class="logo">SOULEFED & MEDOUD ❤️</div>
    <button class="btn" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="logout()">Déconnexion 🔒</button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('memories', event)">📖 Souvenirs</button>
    <button class="tab-btn" onclick="switchTab('gallery', event)">🖼️ Photos</button>
    <button class="tab-btn" onclick="switchTab('notes', event)">💌 Messages</button>
    <button class="tab-btn" onclick="switchTab('bucket', event)">✨ Nos Objectifs</button>
  </div>

  <main>
    <div id="memories-tab" class="tab-content active">
      <div class="add-form">
        <h3>Ajouter un nouveau souvenir</h3>
        <div class="form-grid">
          <input type="text" id="mem-title" placeholder="Titre du souvenir">
          <input type="date" id="mem-date">
        </div>
        <textarea id="mem-desc" rows="3" placeholder="Écrivez les détails ici..."></textarea>
        <button class="btn" style="margin-top: 12px;" onclick="addMemory()">Enregistrer 💾</button>
      </div>
      <div id="memories-grid" class="grid-cards"></div>
    </div>

    <div id="gallery-tab" class="tab-content">
      <div class="add-form">
        <h3>Ajouter une photo depuis votre appareil 📱💻</h3>
        <div class="form-grid">
          <input type="file" id="img-file" accept="image/*">
          <input type="text" id="img-caption" placeholder="Description de la photo">
        </div>
        <button class="btn" onclick="uploadImage()">Importer la Photo 📷</button>
      </div>
      <div id="gallery-grid" class="grid-cards"></div>
    </div>

    <div id="notes-tab" class="tab-content">
      <div class="add-form">
        <h3>Écrire un message privé</h3>
        <input type="text" id="note-sender" placeholder="De la part de (Mohamed / Soulefed)" style="margin-bottom: 12px;">
        <textarea id="note-text" rows="3" placeholder="Votre message..."></textarea>
        <button class="btn" style="margin-top: 12px;" onclick="addNote()">Envoyer 💌</button>
      </div>
      <div id="notes-grid" class="grid-cards"></div>
    </div>

    <div id="bucket-tab" class="tab-content">
      <div class="add-form">
        <h3>Ajouter un objectif commun</h3>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="bucket-text" placeholder="Chose à faire ensemble...">
          <button class="btn" style="width: 150px;" onclick="addBucket()">Ajouter ✨</button>
        </div>
      </div>
      <div id="bucket-list"></div>
    </div>
  </main>

  <script>
    const SECRET_PASS = "SOULEFED&MEDOUD";

    window.onload = function() {
      if (localStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('login-screen').style.display = 'none';
        loadData();
      }
    };

    function checkPassword() {
      const input = document.getElementById('pass-input').value;
      if (input === SECRET_PASS) {
        localStorage.setItem('isLoggedIn', 'true');
        document.getElementById('login-screen').style.display = 'none';
        loadData();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    function logout() {
      localStorage.setItem('isLoggedIn', 'false');
      location.reload();
    }

    function switchTab(tabName, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabName + '-tab').classList.add('active');
    }

    function getData(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
    function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

    function loadData() {
      renderMemories();
      renderGallery();
      renderNotes();
      renderBucket();
    }

    /* Souvenirs */
    function addMemory() {
      const title = document.getElementById('mem-title').value;
      const date = document.getElementById('mem-date').value;
      const desc = document.getElementById('mem-desc').value;

      if (!title || !desc) return alert('Veuillez remplir les champs');

      const items = getData('memories');
      items.push({ id: Date.now(), title, date, desc });
      saveData('memories', items);
      
      document.getElementById('mem-title').value = '';
      document.getElementById('mem-desc').value = '';
      renderMemories();
    }

    function renderMemories() {
      const items = getData('memories');
      const grid = document.getElementById('memories-grid');
      grid.innerHTML = items.map(item => `
        <div class="card">
          <button class="delete-btn" onclick="deleteItem('memories', ${item.id})">Supprimer</button>
          <div class="card-title">${item.title}</div>
          <div class="card-date">${item.date || 'Sans date'}</div>
          <div class="card-desc">${item.desc}</div>
        </div>
      `).join('');
    }

    /* رفع الصور المباشر من الموبايل أو الـ PC */
    function uploadImage() {
      const fileInput = document.getElementById('img-file');
      const caption = document.getElementById('img-caption').value;

      if (fileInput.files.length === 0) {
        return alert('Veuillez sélectionner une photo depuis votre galerie');
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      // تحويل الصورة وضغطها للعرض والحفظ
      reader.onload = function(e) {
        const base64Image = e.target.result;
        const items = getData('gallery');
        items.push({ id: Date.now(), url: base64Image, caption: caption });
        
        try {
          saveData('gallery', items);
          fileInput.value = '';
          document.getElementById('img-caption').value = '';
          renderGallery();
        } catch (err) {
          alert('Taille d\'image trop grande! Choisissez une image plus petite.');
        }
      };

      reader.readAsDataURL(file);
    }

    function renderGallery() {
      const items = getData('gallery');
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = items.map(item => `
        <div class="card">
          <button class="delete-btn" onclick="deleteItem('gallery', ${item.id})">Supprimer</button>
          <img src="${item.url}" alt="Photo">
          <div class="card-desc" style="text-align: center;">${item.caption}</div>
        </div>
      `).join('');
    }

    /* Messages */
    function addNote() {
      const sender = document.getElementById('note-sender').value;
      const text = document.getElementById('note-text').value;

      if (!sender || !text) return alert('Veuillez remplir tous les champs');

      const items = getData('notes');
      const formattedDate = new Date().toLocaleDateString('fr-FR');
      items.push({ id: Date.now(), sender, text, date: formattedDate });
      saveData('notes', items);

      document.getElementById('note-text').value = '';
      renderNotes();
    }

    function renderNotes() {
      const items = getData('notes');
      const grid = document.getElementById('notes-grid');
      grid.innerHTML = items.map(item => `
        <div class="card">
          <button class="delete-btn" onclick="deleteItem('notes', ${item.id})">Supprimer</button>
          <div class="card-title">De: ${item.sender}</div>
          <div class="card-date">${item.date}</div>
          <div class="card-desc">"${item.text}"</div>
        </div>
      `).join('');
    }

    /* Objectifs */
    function addBucket() {
      const text = document.getElementById('bucket-text').value;
      if (!text) return;

      const items = getData('bucket');
      items.push({ id: Date.now(), text, done: false });
      saveData('bucket', items);

      document.getElementById('bucket-text').value = '';
      renderBucket();
    }

    function toggleBucket(id) {
      const items = getData('bucket');
      const item = items.find(i => i.id === id);
      if (item) item.done = !item.done;
      saveData('bucket', items);
      renderBucket();
    }

    function renderBucket() {
      const items = getData('bucket');
      const list = document.getElementById('bucket-list');
      list.innerHTML = items.map(item => `
        <div class="checklist-item ${item.done ? 'done' : ''}">
          <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleBucket(${item.id})">
          <span style="flex:1;">${item.text}</span>
          <button class="delete-btn" style="position:static;" onclick="deleteItem('bucket', ${item.id})">Supprimer</button>
        </div>
      `).join('');
    }

    function deleteItem(storageKey, id) {
      let items = getData(storageKey);
      items = items.filter(i => i.id !== id);
      saveData(storageKey, items);
      loadData();
    }
  </script>
</body>
</html>
